<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rajwada art sheet (dev)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<link rel="stylesheet" href="../invitations/templates/rajwada/rajwada.css">
<style>
    body { margin: 0; background: #2a060d; font: 14px/1.4 system-ui; color: #f3e6c8; }
    .sheet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 12px; }
    .cell { background: #4b0d19; padding: 14px; border-radius: 6px; display: grid; place-items: center; min-height: 220px; position: relative; }
    .cell.light { background: #f8f0de; color: #3a0a12; }
    .cell > b { position: absolute; top: 6px; left: 8px; font-weight: 500; font-size: 11px; opacity: .7; }
    .cell svg { width: 100%; max-height: 260px; }
    .icons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; width: 100%; }
    .icons svg { width: 44px; height: 44px; }
    .wide { grid-column: span 2; }
    .tall { min-height: 520px; }
    .cell.frames svg { max-height: none; width: auto; }
</style>
</head>
<body class="rj">
<div id="out" class="sheet"></div>
<script src="../invitations/core/js/foundation/core.js"></script>
<script src="../invitations/templates/rajwada/rajwada-art.js"></script>
<script src="art-sheet.js"></script>
</body>
</html>
